<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.3"/>
  
  <!-- Outer glowing ring / screen frame -->
  <rect x="76" y="86" width="360" height="250" rx="28" fill="#1e2230" stroke="#333b52" stroke-width="6"/>
  <rect x="96" y="106" width="320" height="210" rx="18" fill="#0f111a"/>
  
  <!-- Screen Base stand -->
  <path d="M216 336 L196 410 L316 410 L296 336 Z" fill="#2d3345"/>
  <rect x="176" y="410" width="160" height="18" rx="9" fill="url(#gold)"/>

  <!-- Soundwave / Live indicator badge -->
  <circle cx="126" cy="136" r="10" fill="#ef4444"/>
  <line x1="146" y1="136" x2="200" y2="136" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Asian character translation badge "文" / "A" -->
  <rect x="120" y="170" width="110" height="100" rx="14" fill="#1e2436" stroke="#38bdf8" stroke-width="3"/>
  <text x="175" y="235" font-family="'Noto Sans Thai', sans-serif, system-ui" font-size="52" font-weight="bold" fill="#38bdf8" text-anchor="middle">A</text>

  <!-- Arrow -->
  <path d="M246 220 L266 220 M260 212 L268 220 L260 228" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thai character translation badge "ไทย" -->
  <rect x="280" y="170" width="110" height="100" rx="14" fill="#292015" stroke="url(#gold)" stroke-width="3"/>
  <text x="335" y="238" font-family="'Noto Sans Thai', sans-serif, system-ui" font-size="44" font-weight="bold" fill="url(#gold)" text-anchor="middle">ไทย</text>

  <!-- Overlay Subtitle Bubble at bottom -->
  <rect x="110" y="280" width="292" height="42" rx="12" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="307" font-family="'Noto Sans Thai', sans-serif, system-ui" font-size="18" font-weight="bold" fill="#0a0a0a" text-anchor="middle">แปลทับหน้าจอเรียลไทม์</text>
</svg>
